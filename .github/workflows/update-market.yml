name: Update XAR market data

on:
  schedule:
    # Weekdays, roughly every 2 hours during US market hours, plus after the close (times are UTC)
    - cron: "20 14,16,18,20 * * 1-5"
    - cron: "40 21 * * 1-5"
  workflow_dispatch: {}          # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths:
      - scripts/fetch_market.py
      - .github/workflows/update-market.yml

permissions:
  contents: write
  pages: write

concurrency:
  group: update-market
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Fetch prices and headlines
        run: python scripts/fetch_market.py

      - name: Commit if changed
        run: |
          git config user.name "market-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.js
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update XAR market data"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Rebuild the website
        # Pushes made by this job don't trigger a Pages build on their own, so request one.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request skipped"
